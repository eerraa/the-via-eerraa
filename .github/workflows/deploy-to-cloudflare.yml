# ERA VIA fork - Cloudflare Pages deployment (Direct Upload).
#
# Required repository configuration before this job does anything:
#   Variables  CLOUDFLARE_PROJECT_NAME  Pages project name; also the *.pages.dev host.
#   Secrets    CLOUDFLARE_API_TOKEN     API token with the "Cloudflare Pages: Edit" permission.
#              CLOUDFLARE_ACCOUNT_ID    Cloudflare account id.
#
# Until CLOUDFLARE_PROJECT_NAME is set the job is skipped, so an unconfigured
# fork does not accumulate failing runs on every push to main.
#
# Do NOT additionally connect the Cloudflare Pages Git integration to this
# repository. Git integration plus this workflow would deploy the same commit
# twice and race for the production alias. Direct Upload from here is the single
# deployment path.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PROJECT_NAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    defaults:
      run:
        working-directory: the-via-eerraa
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Use Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/firmware-app.html
          node -e 'const fs = require("fs"); const {makers} = require("./config/firmware-catalog.json"); for (const maker of makers) { if (!fs.existsSync(`dist/firmware-app-${maker.id}.html`)) throw new Error(`Missing share page: ${maker.id}`); }'
          test -f dist/404.html
          test -f dist/_redirects
          test -f dist/_headers
          test -f dist/definitions/supported_kbs.json
          test -f dist/definitions/era_advanced.json
          era_count=$(find dist/definitions/era/v3 -type f -name '*.json' | wc -l)
          src_count=$(find era-definitions/custom/v3 -type f -iname '*.json' | wc -l)
          expected_era_count=$(node -e 'const {definitions} = require("./config/era-definitions.manifest.json"); console.log(definitions.reduce((count, entry) => count + 1 + (entry.identities?.length ?? 0) + (entry.legacy ? 1 : 0), 0));')
          echo "ERA overlay files: $era_count (manifest identities: $expected_era_count, canonical sources: $src_count)"
          test "$era_count" -eq "$expected_era_count"
          bundled_count=$(find dist/definitions/v3 -type f -name '*.json' | wc -l)
          snapshot_count=$(find node_modules/via-keyboards/v3 -type f -name '*.json' | wc -l)
          external_count=$(find era-definitions/external/v3 -type f -iname '*.json' | wc -l)
          expected_bundled_count=$((snapshot_count + external_count))
          echo "bundled V3 files: $bundled_count (installed snapshot: $snapshot_count, managed external: $external_count)"
          test "$bundled_count" -eq "$expected_bundled_count"
          file_count=$(find dist -type f | wc -l)
          echo "total files: $file_count (Cloudflare Pages limit: 20000)"
          test "$file_count" -lt 20000

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          # Preserve the existing Pages CLI while updating the action runtime.
          wranglerVersion: '3.90.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: the-via-eerraa
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
